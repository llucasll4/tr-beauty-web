# One-time lockfile generation. Remove after successful resolution; never merge into main.
name: SDK54 — resolve compatible npm lockfile
on:
  push:
    branches:
      - upgrade/phase2-expo-sdk54-20261112

permissions:
  contents: write

jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, '[sdk54-lock-resolved]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install & resolve SDK 54 dependencies (no repository credentials)
        env:
          CI: '1'
        run: |
          set -euo pipefail
          # The SDK 53 lockfile must not influence resolution of SDK 54 packages.
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npx expo install --fix --npm
          npx expo install --check
      - name: Commit npm manifest and lockfile only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(expo): resolve SDK 54 npm lockfile [sdk54-lock-resolved]"
          fi
      - name: Push verified lockfile to upgrade branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin "HEAD:${GITHUB_REF_NAME}"
          fi
