# Temporary isolated SDK 53 lockfile generation; remove after verification.
name: SDK53 — resolve dependency lockfile
on:
  push:
    branches:
      - upgrade/phase2-expo-sdk53-20261112

permissions:
  contents: write

jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[sdk53-lock-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Resolve SDK 53 dependencies in a clean runner
        env:
          CI: '1'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx expo install --fix --npm
          npx expo install --check
      - name: Commit only npm manifest and lockfile changes to upgrade branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(expo): resolve SDK 53 versions and npm lockfile [sdk53-lock-generated]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
