# One-time scaffold, removed before PR (only runs when this file is added).
name: Phase4 rescheduling migration scaffold
on:
  push:
    branches: [feat/phase4-simplified-rescheduling-20261113]
    paths: [.github/workflows/phase4-reschedule-scaffold.yml]
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Scaffold migration with pinned Supabase CLI v2
        run: |
          set -euo pipefail
          npm exec --yes --package=supabase@2.81.3 -- supabase migration new phase4_client_rescheduling
      - name: Commit scaffold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- supabase/migrations/
          git commit -m "chore(db): scaffold Phase 4 rescheduling migration"
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin "HEAD:${GITHUB_REF_NAME}"
