name: TR Beauty — Build, browser, booking and loyalty regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-checks:
    name: app-tests-and-build
    # Pinned for Playwright 1.55 Chromium dependencies; ubuntu-latest now 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Dummy publishable values: NEVER expose credentials to GitHub Actions.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_not_a_real_key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies (lockfile)
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build Expo web
        run: npm run build
      # Playwright is isolated from app dependencies and installed AFTER build.
      # Browser tests use only fake accounts and an offline Supabase fixture.
      - name: Install pinned Chromium for browser tests
        run: |
          npm install --global playwright@1.55.1
          playwright install --with-deps chromium
      - name: Browser smoke - desktop, mobile, client and admin
        run: NODE_PATH="$(npm root -g)" node tests/browser-smoke.cjs
      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  db-regression:
    name: booking-points-db-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tr_tests
          POSTGRES_PASSWORD: tr_tests
          POSTGRES_DB: tr_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tr_tests -d tr_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: tr_tests
      PGPASSWORD: tr_tests
      PGDATABASE: tr_tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install PostgreSQL client if needed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Extract actual database function bodies from project migrations
        run: node scripts/extract-db-functions.cjs
      - name: Execute SQL regression in isolated PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/db/fixture.sql
          psql -v ON_ERROR_STOP=1 -f tests/db/generated-functions.sql
          psql -v ON_ERROR_STOP=1 -f tests/db/install-triggers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111_phase1_restrict_trigger_rpc.sql
          psql -v ON_ERROR_STOP=1 -f tests/db/regression.sql
